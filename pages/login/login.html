<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="login.css">
    <title>Pet Shop</title>
</head>
<body>
    <header>
        <div class="sidebar">
            <a href="../home/home.html">
            <img src="https://t3.ftcdn.net/jpg/02/53/08/30/360_F_253083014_MH4h16llY6063TBkG8h7SDBuSyaOV2vi.jpg" alt="Logo Icon" class="sidebar-logo">
            </a>
            <div class="main-buttons">
                <span>Cães</span>
                <span>Gatos</span>
                <span>Carrinho</span>
                <span>Apoio ao Cliente</span>
            </div>
            <div class="auth-buttons">
                <a class="sign-button" href="login.html">Sign in</a>
                <a class="register-button">Register</a>
            </div>
        </div>
    </header>
    <section class="sign-card">
        <form class="sign-form" action="../account/account.html" method="post" novalidate>
            <h2>Sign In to Pet Shop</h2>
            <label for="email">Username or Email Address</label>
            <input id="email" name="email" type="text" required>

            <label for="password">Password</label>
            <a href="#">Forgot password?</a>
            <input id="password" name="password" type="password" required minlength="6">

            <div class="form-row">
                <label class="checkbox">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
            </div>
            <button type="submit" class="submit-button">Sign In</button>

            <p class="signup-link">Don't have an account? <a href="#">Register</a></p>
        </form>
    </section>
</body>
</html>
