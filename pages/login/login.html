<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="login.css">
    <title>Pet Shop</title>
</head>
<body>
    <header>
        <div class="sidebar">
            <a href="../home/home.html">
            <img src="https://t3.ftcdn.net/jpg/02/53/08/30/360_F_253083014_MH4h16llY6063TBkG8h7SDBuSyaOV2vi.jpg" alt="Logo Icon" class="sidebar-logo">
            </a>
            <div class="main-buttons">
                <span>Cães</span>
                <span>Gatos</span>
                <span><a href="../cart/cart.html">Carrinho</a></span>
                <span>Apoio ao Cliente</span>
            </div>
            <div class="auth-buttons">
                <a class="sign-button" href="login.html">Iniciar Sessão</a>
                <a class="register-button" href="../register/register.html">Registrar</a>
            </div>
        </div>
    </header>
    <section class="sign-card">
        <form class="sign-form" action="../home/home.html" method="get" novalidate>
            <h2>Iniciar Sessão na Pet Shop</h2>

            <div class="form-input">
                <label for="email">Username ou Endereço de Email</label>
                <input id="email" name="email" type="text" required>
            </div>

            <div class="form-input">
                <div class="form-password">
                    <label for="password">Password</label>
                    <a href="#">Esqueceu da Password?</a>
                </div>
                <input id="password" name="password" type="password" required minlength="6">
            </div>

            <div class="form-remember">
                <label class="checkbox">
                    <input type="checkbox" name="remember">
                    Manter sessão
                </label>
            </div>

            <button type="submit" class="submit-button">Iniciar Sessão</button>

            <p class="signup-link">Novo na Pet Shop? <a href="../register/register.html">Crie uma Conta</a></p>
        </form>
    </section>
</body>
</html>
