<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="product.css">
    <title>Pet Shop</title>
</head>
<body>
    <header>
        <div class="sidebar">
            <a href="../home/home.html">
                <img src="https://t3.ftcdn.net/jpg/02/53/08/30/360_F_253083014_MH4h16llY6063TBkG8h7SDBuSyaOV2vi.jpg" alt="Logo Icon" class="sidebar-logo">
            </a>
            <div class="main-buttons">
                <span>Cães</span>
                <span>Gatos</span>
                <span><a href="../cart/cart.html">Carrinho</a></span>
                <span>Apoio ao Cliente</span>
            </div>
            <div class="auth-buttons">
                <a class="sign-button" href="../login/login.html">Iniciar Sessão</a>
                <a class="register-button" href="../register/register.html">Registrar</a>
            </div>
        </div>
    </header>
    <section class="product-card">
        <img class="product-image" src="https://images.pexels.com/photos/164186/pexels-photo-164186.jpeg" alt="Sérgio Portrait">
        <div class="product-info">
            <div class="product-details">
                <h2>Sérgio</h2>
                <p class="product-price"><span class="product-currency">€</span>10,00</p>
                <p class="product-description">Welsh Corgi</p>
            </div>
            
            <a class="add-to-cart" href="../cart/cart.html">               
                <button class="add-button">Adicionar ao Carrinho</button>
            </a>
        </div>
    </section>
</body>
</html>
