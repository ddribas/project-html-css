<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="home.css">
    <title>Pet Shop</title>
</head>
<body>
    <header>
        <div class="sidebar">
            <a href="home.html">
                <img src="https://t3.ftcdn.net/jpg/02/53/08/30/360_F_253083014_MH4h16llY6063TBkG8h7SDBuSyaOV2vi.jpg" alt="Logo Icon" class="sidebar-logo">
            </a>
            <div class="main-buttons">
                <span>Cães</span>
                <span>Gatos</span>
                <span>Carrinho</span>
                <span>Apoio ao Cliente</span>
            </div>
            <div class="auth-buttons">
                <a class="sign-button" href="../login/login.html">Sign in</a>
                <a class="register-button">Register</a>
            </div>
        </div>
    </header>
    <section class="home-title">
        <h1>Pet Shop</h1>
        <h2>para cada animal um dono</h2>
    </section>
    <section class="selection">
        <div class="animal-selection">
            <div>
                <span>
                    <img src="https://images.pexels.com/photos/164186/pexels-photo-164186.jpeg" alt="Sérgio Portrait" class="animal-portrait">
                </span>
                <span>
                    <h3>Sérgio</h3>
                    <p>€10,00<br/>Welsh Corgi</p>
                </span>
            </div>
            <div>
                <span>
                    <img src="https://images.pexels.com/photos/485294/pexels-photo-485294.jpeg"  alt="Maria Isabel Constança de Bragança Portrait" class="animal-portrait">
                </span>
                <span>
                    <h3>Maria Isabel Constança de Bragança</h3>
                    <p>€1.000,00<br/>Chihuahua</p>
                </span>
            </div>
            <div>
                <span>
                    <img  src="https://images.pexels.com/photos/1851164/pexels-photo-1851164.jpeg" alt="Donut Portrait" class="animal-portrait">
                </span>
                <span>
                    <h3>Donut</h3>
                    <p>Grátis<br/>Sei lá</p>
                </span>
            </div>
        </div>
        <div class="animal-selection">
            <div>
                <span>
                    <img src="https://i.pinimg.com/736x/31/b8/fd/31b8fdd03b4faa00baee5ee95dd15617.jpg" alt="Roberto Portrait" class="animal-portrait">
                </span>
                <span>
                    <h3>Roberto</h3>
                    <p>€7,00<br/>Preto e Branco</p>
                </span>
            </div>
            <div>
                <span>
                    <img src="https://i.pinimg.com/236x/39/a1/1a/39a11a57e6830712cc9cca0abffd922d.jpg"  alt="Zé Portrait" class="animal-portrait">
                </span>
                <span>
                    <h3>Zé</h3>
                    <p>€27.156,99<br/>Laranja</p>
                </span>
            </div>
            <div>
                <span>
                    <img  src="https://preview.redd.it/need-some-advice-regarding-collage-studies-and-hostel-v0-4hvsa7jrxrhf1.jpeg?auto=webp&s=e34b523589bfbe1c89812c52fb1933da9112dfad" alt="Esparguete Portrait" class="animal-portrait">
                </span>
                <span>
                    <h3>Esparguete</h3>
                    <p>€27,99<br/>Preto e Branco</p>
                </span>
            </div>
        </div>
