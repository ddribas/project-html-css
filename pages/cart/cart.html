<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="cart.css">
    <title>Pet Shop</title>
</head>
<body>
    <header>
        <div class="sidebar">
            <a href="../home/home.html">
            <img src="https://t3.ftcdn.net/jpg/02/53/08/30/360_F_253083014_MH4h16llY6063TBkG8h7SDBuSyaOV2vi.jpg" alt="Logo Icon" class="sidebar-logo">
            </a>
            <div class="main-buttons">
                <span>Cães</span>
                <span>Gatos</span>
                <span><a href="cart.html">Carrinho</a></span>
                <span>Apoio ao Cliente</span>
            </div>
            <div class="auth-buttons">
                <a class="sign-button" href="../login/login.html">Iniciar Sessão</a>
                <a class="register-button" href="../register/register.html">Registrar</a>
            </div>
        </div>
    </header>
    <section class="cart-card">
        <div class="cart-list">
            <div class="cart-product">
                <div class="cart-product-info">
                    <img class="product-image" src="https://images.pexels.com/photos/164186/pexels-photo-164186.jpeg" alt="Sérgio Portrait">
                    <div >
                        <h2>Sérgio</h2>
                        <p class="product-description">Welsh Corgi</p>
                        <p class="product-price"><b>€10,00</b></p>
                    </div>
                </div>
                <div class="cart-product-remove">
                    X
                </div>
            </div>
            <div class="cart-product">
                <div class="cart-product-info">
                    <img class="product-image" src="https://i.pinimg.com/736x/31/b8/fd/31b8fdd03b4faa00baee5ee95dd15617.jpg" alt="Roberto Portrait">
                    <div >
                        <h2>Roberto</h2>
                        <p class="product-description">Preto e Branco</p>
                        <p class="product-price"><b>€7,00</b></p>
                    </div>
                </div>
                <div class="cart-product-remove">
                    X
                </div>
            </div>
        </div>
        <div class="cart-info">
            <div class="cart-info-details">
                <div class="cart-info-subtotal">
                    <p>Subtotal: <b>€17,00</b></p>
                    <p>Transportes: <b>€25,99</b></p>
                </div>
                <div class="cart-info-discount">
                    <p><b>Descontos</b></p>
                    <p>Envio Grátis: -€25,99</p>
                </div>
                <div class="cart-info-total">
                    <h2><b>Total: €17,00</b></h2>
                </div>
            </div>
            <a class="end-purchase" href="../home/home.html">
                <button class="checkout-button">Finalizar Compra</button>
            </a>
        </div>
    </section>
</body>
</html>
