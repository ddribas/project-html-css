<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="register.css">
    <title>Pet Shop</title>
</head>
<body>
    <header>
        <div class="sidebar">
            <a href="../home/home.html">
            <img src="https://t3.ftcdn.net/jpg/02/53/08/30/360_F_253083014_MH4h16llY6063TBkG8h7SDBuSyaOV2vi.jpg" alt="Logo Icon" class="sidebar-logo">
            </a>
            <div class="main-buttons">
                <span>Cães</span>
                <span>Gatos</span>
                <span>Carrinho</span>
                <span>Apoio ao Cliente</span>
            </div>
            <div class="auth-buttons">
                <a class="sign-button" href="../login/login.html">Sign in</a>
                <a class="register-button" href="register.html">Register</a>
            </div>
        </div>
    </header>
    <section class="sign-card">
        <form class="sign-form" action="../account/account.html" method="post" novalidate>
            <h2>Sign In to Pet Shop</h2>

            <div class="form-input">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required minlength="3" maxlength="12">
            </div>

            <div class="form-input">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="text" required>
            </div>

            <div class="form-input">
                <div class="form-password">
                    <label for="password">Password</label>
                </div>
                <input id="password" name="password" type="password" required minlength="6">
            </div>

            <div class="form-input">
                <label for="email">Country</label>
                <input id="email" name="email" type="text" required>
            </div>

            <button type="submit" class="submit-button">Register</button>
         </form>
    </section>
</body>
</html>
